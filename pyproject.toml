[project]
name = "flowsense-engine"
version = "0.2.1"
description = "Temporal drift and anomaly detection for Apache Airflow"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Omer Cengiz" },
]
keywords = [
    "airflow",
    "anomaly-detection",
    "data-engineering",
    "observability",
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "numpy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.6",
]

mcp = [
    "mcp[cli]>=2.0",
]

[project.scripts]
flowsense = "flowsense.cli.main:app"
flowsense-mcp = "flowsense.mcp.server:main"

[project.urls]
Homepage = "https://github.com/omercengiz/flowsense-engine"
Issues = "https://github.com/omercengiz/flowsense-engine/issues"
Repository = "https://github.com/omercengiz/flowsense-engine"
Changelog = "https://github.com/omercengiz/flowsense-engine/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowsense = ["py.typed"]

[tool.pyright]
include = ["src", "benchmarks"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: tests that require a running Airflow instance",
]
