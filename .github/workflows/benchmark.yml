name: Analysis benchmark

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Number of tasks in the synthetic DAG
        required: true
        default: "100"
      runs:
        description: Number of historical DAG runs
        required: true
        default: "50"
      iterations:
        description: Number of measured iterations
        required: true
        default: "5"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run benchmark
        env:
          BENCHMARK_TASKS: ${{ inputs.tasks }}
          BENCHMARK_RUNS: ${{ inputs.runs }}
          BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
        run: |
          uv run python -m benchmarks.benchmark_analysis \
            --tasks "$BENCHMARK_TASKS" \
            --runs "$BENCHMARK_RUNS" \
            --iterations "$BENCHMARK_ITERATIONS" \
            --output benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: flowsense-analysis-benchmark
          path: benchmark-results.json
