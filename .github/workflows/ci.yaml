name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run unit tests
        run: uv run python -m pytest -m "not integration" -v

      - name: Build package
        run: uv run python -m build

      - name: Smoke test wheel
        run: |
          uv venv /tmp/flowsense-wheel-test
          uv pip install --python /tmp/flowsense-wheel-test/bin/python dist/*.whl
          /tmp/flowsense-wheel-test/bin/flowsense --version
          /tmp/flowsense-wheel-test/bin/flowsense --help

  airflow-contract:
    name: Airflow ${{ matrix.airflow-major }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow-major:
          - "2"
          - "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify Airflow REST contract
        env:
          FLOWSENSE_AIRFLOW_CONTRACT_VERSION: ${{ matrix.airflow-major }}
        run: uv run python -m pytest -m airflow_contract -v

  observability:
    name: Observability assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deploy/observability/docker-compose.yml config --quiet

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/deploy/observability:/workspace:ro" \
            --workdir /workspace \
            prom/prometheus:v3.14.0 \
            check rules alerts.yml

      - name: Test Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/deploy/observability:/workspace:ro" \
            --workdir /workspace \
            prom/prometheus:v3.14.0 \
            test rules alerts.test.yml
