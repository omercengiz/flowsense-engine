name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,mcp]"

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run Pyright
        run: pyright

      - name: Run unit tests
        run: python -m pytest -m "not integration" -v

      - name: Build package
        run: python -m build

      - name: Smoke test wheel
        run: |
          uv venv /tmp/flowsense-wheel-test
          uv pip install --python /tmp/flowsense-wheel-test/bin/python dist/*.whl
          /tmp/flowsense-wheel-test/bin/flowsense --help
